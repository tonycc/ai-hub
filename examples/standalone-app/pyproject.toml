[project]
name = "ai-hub-standalone-example"
version = "0.1.0"
description = "Independent Python application integrating with AI Hub"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ai-hub-sdk",
  "aio-pika>=9.5,<10",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "starlette>=0.47,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
]

[tool.uv.sources]
ai-hub-sdk = { workspace = true }

[project.scripts]
standalone-app = "standalone_app.cli:run"
standalone-outbox-publisher = "standalone_app.cli:run_publisher"
standalone-event-consumer = "standalone_app.cli:run_consumer"
standalone-snapshot-export = "standalone_app.cli:run_snapshot_export"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standalone_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
