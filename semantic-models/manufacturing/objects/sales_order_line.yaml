object: SalesOrderLine
display_name: 销售订单明细
description: 订单行(品号 / 数量 / 单价)
domain: 销售
source_of_truth: 鼎捷 ERP 订单单身
keys: [order_no, line_no]
properties:
  - { name: order_no, type: string, desc: 订单号 }
  - { name: line_no, type: string, desc: 行号 }
  - { name: material, type: ref, ref: Material, desc: 品号 }
  - { name: quantity, type: decimal, desc: 数量 }
  - { name: unit_price, type: money, desc: 单价 }
bindings:
  - source: digiwin_yifei
    tables: [COPTD]
    status: draft
  - source: digiwin_e10
    tables: [SALES_ORDER_D, SALES_ORDER]
    status: draft
    key_map:
      order_no: SALES_ORDER.DOC_NO (join SALES_ORDER_D.SALES_ORDER_ID)
      line_no: SALES_ORDER_D.SEQUENCE_NUMBER
    field_map:
      order_no: SALES_ORDER.DOC_NO (join SALES_ORDER_D.SALES_ORDER_ID)
      line_no: SALES_ORDER_D.SEQUENCE_NUMBER
      material: ITEM.ITEM_CODE (join SALES_ORDER_D.ITEM_ID)
      quantity: SALES_ORDER_D.QUANTITY
      unit_price: SALES_ORDER_D.UNIT_PRICE
    watermark: SALES_ORDER_D.LAST_MODIFIED_DATE
    notes: E10-like 参考表形;E10 单身通过 SALES_ORDER_ID 关联单头取单号
