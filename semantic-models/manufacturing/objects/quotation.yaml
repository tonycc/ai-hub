semantic_id: manufacturing.quotation
display_name: 报价单
description: 询单与报价记录(含未成交);接单评审链核心历史数据,MVP 阶段主要来自 Excel 导入
domain: 销售
authoritative_source_system: 历史报价 Excel(MVP)/ 后续沉淀于平台
keys:
- quote_no
properties:
- name: quote_no
  type: string
  description: 报价单号
  required: true
- name: customer
  type: ref
  description: 客户
  ref: manufacturing.customer
- name: quote_date
  type: date
  description: 报价日期
- name: inquiry_at
  type: datetime
  description: 询单接收时间(报价响应时长起点)
- name: submitted_at
  type: datetime
  description: 报出时间(报价响应时长终点;草稿为空)
- name: spec_summary
  type: text
  description: 规格摘要(竿:长度/节数/调性;轮:齿比/轴承;饵:类型/颜色数)
- name: target_price
  type: money
  description: 客户目标价
- name: quoted_price
  type: money
  description: 报价(阶梯明细放自定义字段)
- name: currency
  type: string
  description: 币别
- name: fx_assumption
  type: decimal
  description: 汇率假设
- name: result
  type: enum
  description: 结果
  enum_values:
  - 成交
  - 未成交
  - 待定
states:
- 草稿
- 已报出
- 成交
- 未成交
