name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python, contracts, and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
      - name: Install locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run Python gate
        run: bash scripts/ci/python.sh

  frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install locked Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.18.1"
          cache: npm
          package-manager-cache: false
      - name: Run frontend gate
        run: bash scripts/ci/frontend.sh

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run deployment gate
        run: bash scripts/ci/deploy.sh

  macos-deployment:
    name: Native macOS deployment smoke
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run deployment smoke with macOS system tools
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          test "$(uname -s)" = Darwin
          test "$(command -v sed)" = /usr/bin/sed
          /bin/bash scripts/ci/macmini-image-deploy.test.sh
          /bin/bash scripts/ci/macmini-release-watcher.test.sh
          /bin/bash scripts/ci/macmini-promotion.test.sh

  m1-runtime:
    name: M1 identity and API runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run isolated M1 runtime gate
        run: bash scripts/ci/m1-runtime.sh

  m7-runtime:
    name: M7 ingest and C1-C compatibility runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out locked data2agent adapter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: xingyekuo-spec/data2agent
          ref: 60bcbe22f0db6457d81d24a0d9924723e085cdae
          path: external/data2agent
          persist-credentials: false
      - name: Run isolated M7 runtime gate
        env:
          DATA2AGENT_ROOT: ${{ github.workspace }}/external/data2agent
        run: bash scripts/ci/m7-runtime.sh

  required-gate:
    name: Required gate
    if: ${{ always() }}
    needs:
      - python
      - frontend
      - deployment
      - macos-deployment
      - m1-runtime
      - m7-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          MACOS_DEPLOYMENT_RESULT: ${{ needs.macos-deployment.result }}
          M1_RUNTIME_RESULT: ${{ needs.m1-runtime.result }}
          M7_RUNTIME_RESULT: ${{ needs.m7-runtime.result }}
        run: |
          test "${PYTHON_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${DEPLOYMENT_RESULT}" = "success"
          test "${MACOS_DEPLOYMENT_RESULT}" = "success"
          test "${M1_RUNTIME_RESULT}" = "success"
          test "${M7_RUNTIME_RESULT}" = "success"
