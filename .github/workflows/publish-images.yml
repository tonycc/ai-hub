name: Publish production release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Calendar version without the v prefix, for example 2026.09.03-1
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  required-ci:
    name: Required CI before publishing
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-arm64:
    name: Build and publish linux/arm64 images
    needs: required-ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main and a stable release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == refs/heads/main ]] \
            || { printf 'production releases must run from main\n' >&2; exit 1; }
          [[ "${RELEASE_VERSION}" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])-[1-9][0-9]*$ ]] \
            || { printf 'invalid release version: %s\n' "${RELEASE_VERSION}" >&2; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/main \
            || { printf 'release commit %s is not on main\n' "${source_sha}" >&2; exit 1; }
          {
            printf 'SOURCE_SHA=%s\n' "${source_sha}"
            printf 'RELEASE_VERSION=%s\n' "${RELEASE_VERSION}"
            printf 'RELEASE_TAG=v%s\n' "${RELEASE_VERSION}"
          } >>"${GITHUB_ENV}"

      - name: Resolve immutable image tags
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          platform_image="ghcr.io/${owner}/ai-hub-platform"
          portal_image="ghcr.io/${owner}/ai-hub-portal"
          sha_tag="sha-${SOURCE_SHA}"
          {
            printf 'PLATFORM_IMAGE=%s\n' "${platform_image}"
            printf 'PORTAL_IMAGE=%s\n' "${portal_image}"
            printf 'SHA_TAG=%s\n' "${sha_tag}"
          } >>"${GITHUB_ENV}"

      - name: Refuse Release or Tag reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            printf 'GitHub Release already exists: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}")"
          [[ -z "${existing_tag}" ]] \
            || { printf 'Git tag already exists: %s\n' "${RELEASE_TAG}" >&2; exit 1; }

      - name: Validate deployment bundle contract
        run: bash scripts/ci/deploy.sh

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create native ARM64 builder
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name ai-hub-publisher --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push platform image
        shell: bash
        run: |
          set -euo pipefail
          tags=(--tag "${PLATFORM_IMAGE}:${SHA_TAG}")
          tags+=(--tag "${PLATFORM_IMAGE}:${RELEASE_TAG}")
          docker buildx build \
            --platform linux/arm64 \
            --file backend/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${RUNNER_TEMP}/platform-metadata.json" \
            --push \
            "${tags[@]}" \
            .

      - name: Build and push portal image
        shell: bash
        run: |
          set -euo pipefail
          tags=(--tag "${PORTAL_IMAGE}:${SHA_TAG}")
          tags+=(--tag "${PORTAL_IMAGE}:${RELEASE_TAG}")
          docker buildx build \
            --platform linux/arm64 \
            --file deploy/docker/portal.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${RUNNER_TEMP}/portal-metadata.json" \
            --push \
            "${tags[@]}" \
            .

      - name: Record immutable image references
        shell: bash
        run: |
          set -euo pipefail
          platform_digest="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/platform-metadata.json")"
          portal_digest="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/portal-metadata.json")"
          images_file="${RUNNER_TEMP}/images.env"
          {
            printf 'AI_HUB_PLATFORM_IMAGE_REF=%s:%s@%s\n' "${PLATFORM_IMAGE}" "${SHA_TAG}" "${platform_digest}"
            printf 'AI_HUB_PORTAL_IMAGE_REF=%s:%s@%s\n' "${PORTAL_IMAGE}" "${SHA_TAG}" "${portal_digest}"
          } >"${images_file}"
          {
            printf '### Immutable production image references\n\n'
            printf '```dotenv\n'
            cat "${images_file}"
            printf '```\n'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Record release migration inventory
        shell: bash
        run: |
          set -euo pipefail
          images_file="${RUNNER_TEMP}/images.env"
          platform_ref="$(sed -n 's/^AI_HUB_PLATFORM_IMAGE_REF=//p' "${images_file}")"
          portal_ref="$(sed -n 's/^AI_HUB_PORTAL_IMAGE_REF=//p' "${images_file}")"
          heads="$(docker run --rm --entrypoint python "${platform_ref}" -c '
          from pathlib import Path
          from ai_hub_platform.operations.release import migration_heads

          for component, revision in sorted(migration_heads(Path("/workspace")).items()):
              print(f"{component}={revision}")
          ')"
          core_head="$(sed -n 's/^core=//p' <<<"${heads}")"
          raw_head="$(sed -n 's/^raw=//p' <<<"${heads}")"
          [[ "${core_head}" =~ ^[0-9A-Za-z_.-]+$ ]] \
            || { printf 'invalid core migration head: %s\n' "${core_head}" >&2; exit 1; }
          [[ "${raw_head}" =~ ^[0-9A-Za-z_.-]+$ ]] \
            || { printf 'invalid raw migration head: %s\n' "${raw_head}" >&2; exit 1; }
          release_file="${RUNNER_TEMP}/release.env"
          {
            printf 'AI_HUB_RELEASE_SCHEMA_VERSION=2\n'
            printf 'AI_HUB_RELEASE_TAG=%s\n' "${RELEASE_TAG}"
            printf 'AI_HUB_RELEASE_COMMIT_SHA=%s\n' "${SOURCE_SHA}"
            printf 'AI_HUB_RELEASE_REQUIRED_CI=passed\n'
            printf 'AI_HUB_RELEASE_CI_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
            printf 'AI_HUB_PLATFORM_IMAGE_REF=%s\n' "${platform_ref}"
            printf 'AI_HUB_PORTAL_IMAGE_REF=%s\n' "${portal_ref}"
            printf 'AI_HUB_RELEASE_CORE_HEAD=%s\n' "${core_head}"
            printf 'AI_HUB_RELEASE_RAW_HEAD=%s\n' "${raw_head}"
          } >"${release_file}"
          {
            printf '\n### Release migration inventory\n\n'
            printf 'Core head: `%s`  \n' "${core_head}"
            printf 'Raw head: `%s`\n' "${raw_head}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Package Mac mini deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="${RUNNER_TEMP}/ai-hub-macmini-deploy"
          mkdir -p "${bundle_root}/scripts" "${bundle_root}/docs"
          cp -R deploy "${bundle_root}/deploy"
          cp -R scripts/deploy "${bundle_root}/scripts/deploy"
          cp docs/macmini-image-deployment.md "${bundle_root}/docs/"
          cp "${RUNNER_TEMP}/images.env" "${bundle_root}/images.env"
          cp "${RUNNER_TEMP}/release.env" "${bundle_root}/release.env"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/ai-hub-macmini-deploy.tar.gz" \
            ai-hub-macmini-deploy
          bundle_sha="$(sha256sum "${RUNNER_TEMP}/ai-hub-macmini-deploy.tar.gz" | awk '{print $1}')"
          printf '%s  %s\n' "${bundle_sha}" ai-hub-macmini-deploy.tar.gz \
            >"${RUNNER_TEMP}/ai-hub-macmini-deploy.tar.gz.sha256"

      - name: Attest GitHub-hosted build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/ai-hub-macmini-deploy.tar.gz

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            printf 'GitHub Release already exists: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            --draft \
            --target "${SOURCE_SHA}" \
            --title "AI Hub ${RELEASE_TAG}" \
            --notes "Manually approved, attested Mac mini release for commit ${SOURCE_SHA}. The Mac mini watcher stages and verifies it; production promotion still requires a fresh off-host backup receipt."
          release_target="$(gh release view "${RELEASE_TAG}" --json targetCommitish --jq .targetCommitish)"
          [[ "${release_target}" == "${SOURCE_SHA}" ]] \
            || { printf 'Draft Release target mismatch: %s\n' "${release_target}" >&2; exit 1; }
          gh release upload "${RELEASE_TAG}" \
            "${RUNNER_TEMP}/ai-hub-macmini-deploy.tar.gz" \
            "${RUNNER_TEMP}/ai-hub-macmini-deploy.tar.gz.sha256"
          gh release edit "${RELEASE_TAG}" --draft=false --latest
          [[ "$(gh release view "${RELEASE_TAG}" --json isImmutable --jq .isImmutable)" == true ]] \
            || { printf 'Release immutability is not enabled for %s\n' "${RELEASE_TAG}" >&2; exit 1; }
          gh release verify "${RELEASE_TAG}"

      - name: Log out from GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
