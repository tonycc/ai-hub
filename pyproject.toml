[tool.uv.workspace]
members = [
  "backend",
  "sdk/python",
  "examples/standalone-app",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
  "backend/src",
  "sdk/python/src",
  "examples/standalone-app/src",
]
include = [
  "backend/src",
  "backend/tests",
  "sdk/python/src",
  "sdk/python/tests",
  "examples/standalone-app/src",
  "examples/standalone-app/tests",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
