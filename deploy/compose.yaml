name: ai-hub-local

x-core-profiles: &core-profiles
  - base-access

x-authentik-environment: &authentik-environment
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__PORT: 5432
  AUTHENTIK_POSTGRESQL__NAME: authentik_db
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_LOG_LEVEL: info

x-standalone-app-environment: &standalone-app-environment
  STANDALONE_ENVIRONMENT: ${STANDALONE_ENVIRONMENT:-local}
  STANDALONE_DATABASE_URL: postgresql+psycopg://standalone_app:${STANDALONE_APP_DB_PASSWORD:?Set STANDALONE_APP_DB_PASSWORD in .env}@postgres:5432/standalone_app_db
  STANDALONE_PLATFORM_API_BASE_URL: ${STANDALONE_PLATFORM_API_BASE_URL:-http://platform.localhost:8088}
  STANDALONE_APPLICATION_ID: ${STANDALONE_APPLICATION_ID:-standalone-example}
  STANDALONE_OIDC_ISSUER: ${STANDALONE_OIDC_ISSUER:-http://auth.localhost:8088/application/o/standalone-example/}
  STANDALONE_OIDC_AUDIENCE: ${STANDALONE_OIDC_AUDIENCE:-standalone-example}
  STANDALONE_OIDC_CLIENT_ID: ${STANDALONE_OIDC_CLIENT_ID:-standalone-example}
  STANDALONE_OIDC_CLIENT_SECRET: ${STANDALONE_OIDC_CLIENT_SECRET:?Set STANDALONE_OIDC_CLIENT_SECRET in .env}
  STANDALONE_OIDC_REDIRECT_URI: ${STANDALONE_OIDC_REDIRECT_URI:-http://app.localhost:8088/auth/callback}
  STANDALONE_OIDC_JWKS_CACHE_TTL_SECONDS: ${STANDALONE_OIDC_JWKS_CACHE_TTL_SECONDS:-300}
  STANDALONE_OIDC_JWKS_STALE_TTL_SECONDS: ${STANDALONE_OIDC_JWKS_STALE_TTL_SECONDS:-3600}
  STANDALONE_SESSION_SECRET: ${STANDALONE_SESSION_SECRET:?Set STANDALONE_SESSION_SECRET in .env}
  STANDALONE_AUTHORIZATION_CACHE_STALE_TTL_SECONDS: ${STANDALONE_AUTHORIZATION_CACHE_STALE_TTL_SECONDS:-300}

x-standalone-app-common: &standalone-app-common
  image: "${STANDALONE_APP_IMAGE_REF:-ai-hub-standalone-example:local}"
  build:
    context: ..
    dockerfile: examples/standalone-app/Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.7-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc}
      UV_VERSION: ${UV_VERSION:-0.9.8}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/live', timeout=2).read()"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  init: true
  restart: unless-stopped

services:
  postgres:
    profiles: *core-profiles
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
      AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD: ${AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD:?Set AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD in .env}
      AI_HUB_PLATFORM_DB_PASSWORD: ${AI_HUB_PLATFORM_DB_PASSWORD:?Set AI_HUB_PLATFORM_DB_PASSWORD in .env}
      AI_HUB_RAW_MIGRATOR_DB_PASSWORD: ${AI_HUB_RAW_MIGRATOR_DB_PASSWORD:?Set AI_HUB_RAW_MIGRATOR_DB_PASSWORD in .env}
      AI_HUB_RAW_DB_PASSWORD: ${AI_HUB_RAW_DB_PASSWORD:?Set AI_HUB_RAW_DB_PASSWORD in .env}
      STANDALONE_MIGRATOR_DB_PASSWORD: ${STANDALONE_MIGRATOR_DB_PASSWORD:?Set STANDALONE_MIGRATOR_DB_PASSWORD in .env}
      STANDALONE_APP_DB_PASSWORD: ${STANDALONE_APP_DB_PASSWORD:?Set STANDALONE_APP_DB_PASSWORD in .env}
    ports:
      - "${AI_HUB_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - type: volume
        source: postgres-data
        target: ${POSTGRES_DATA_VOLUME_TARGET:-/var/lib/postgresql}
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/verify:/opt/ai-hub/postgres-verify:ro

  platform-core-migrate:
    profiles: *core-profiles
    image: "${AI_HUB_PLATFORM_IMAGE_REF:-ai-hub-platform:local}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.7-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc}
        UV_VERSION: ${UV_VERSION:-0.9.8}
    command: ["alembic", "-c", "/workspace/backend/alembic.ini", "upgrade", "head"]
    environment:
      AI_HUB_ENVIRONMENT: ${AI_HUB_ENVIRONMENT:-local}
      AI_HUB_MIGRATION_DATABASE_URL: postgresql+psycopg://ai_hub_platform_migrator:${AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD:?Set AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD in .env}@postgres:5432/platform_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-raw-migrate:
    profiles: *core-profiles
    image: "${AI_HUB_PLATFORM_IMAGE_REF:-ai-hub-platform:local}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.7-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc}
        UV_VERSION: ${UV_VERSION:-0.9.8}
    command: ["alembic", "-c", "/workspace/backend/alembic-raw.ini", "upgrade", "head"]
    environment:
      AI_HUB_ENVIRONMENT: ${AI_HUB_ENVIRONMENT:-local}
      AI_HUB_RAW_MIGRATION_DATABASE_URL: postgresql+psycopg://ai_hub_raw_migrator:${AI_HUB_RAW_MIGRATOR_DB_PASSWORD:?Set AI_HUB_RAW_MIGRATOR_DB_PASSWORD in .env}@postgres:5432/platform_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-api:
    profiles: *core-profiles
    image: "${AI_HUB_PLATFORM_IMAGE_REF:-ai-hub-platform:local}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.7-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc}
        UV_VERSION: ${UV_VERSION:-0.9.8}
    environment:
      AI_HUB_ENVIRONMENT: ${AI_HUB_ENVIRONMENT:-local}
      AI_HUB_APPLICATION_ID: ${AI_HUB_APPLICATION_ID:-ai-hub-platform}
      AI_HUB_DATABASE_URL: postgresql+psycopg://ai_hub_platform:${AI_HUB_PLATFORM_DB_PASSWORD:?Set AI_HUB_PLATFORM_DB_PASSWORD in .env}@postgres:5432/platform_db
      AI_HUB_OIDC_ISSUER: ${AI_HUB_OIDC_ISSUER:-http://auth.localhost:8088/application/o/ai-hub/}
      AI_HUB_OIDC_AUDIENCE: ${AI_HUB_OIDC_AUDIENCE:-ai-hub-platform}
      AI_HUB_AUTHORIZATION_CACHE_TTL_SECONDS: ${AI_HUB_AUTHORIZATION_CACHE_TTL_SECONDS:-60}
      AI_HUB_OIDC_JWKS_CACHE_TTL_SECONDS: ${AI_HUB_OIDC_JWKS_CACHE_TTL_SECONDS:-300}
      AI_HUB_OIDC_JWKS_STALE_TTL_SECONDS: ${AI_HUB_OIDC_JWKS_STALE_TTL_SECONDS:-3600}
      AI_HUB_PORTAL_OIDC_ISSUER: ${AI_HUB_PORTAL_OIDC_ISSUER:-http://auth.localhost:8088/application/o/ai-hub-portal/}
      AI_HUB_PORTAL_OIDC_AUDIENCE: ${AI_HUB_PORTAL_OIDC_AUDIENCE:-ai-hub-portal}
      AI_HUB_PORTAL_OIDC_CLIENT_ID: ${AI_HUB_PORTAL_OIDC_CLIENT_ID:-ai-hub-portal}
      AI_HUB_PORTAL_OIDC_CLIENT_SECRET: ${AI_HUB_PORTAL_OIDC_CLIENT_SECRET:?Set AI_HUB_PORTAL_OIDC_CLIENT_SECRET in .env}
      AI_HUB_PORTAL_OIDC_REDIRECT_URI: ${AI_HUB_PORTAL_OIDC_REDIRECT_URI:-http://platform.localhost:8088/auth/callback}
      AI_HUB_PORTAL_OIDC_LOGOUT_REDIRECT_URI: ${AI_HUB_PORTAL_OIDC_LOGOUT_REDIRECT_URI:-http://platform.localhost:8088/}
      AI_HUB_PORTAL_SESSION_TTL_SECONDS: ${AI_HUB_PORTAL_SESSION_TTL_SECONDS:-900}
      AI_HUB_AUTHENTIK_API_URL: ${AI_HUB_AUTHENTIK_API_URL:-http://authentik-server:9000/api/v3}
      AI_HUB_AUTHENTIK_EXTERNAL_URL: ${AI_HUB_AUTHENTIK_EXTERNAL_URL:-http://auth.localhost:8088}
      AI_HUB_AUTHENTIK_API_TOKEN: ${AI_HUB_AUTHENTIK_API_TOKEN:?Set AI_HUB_AUTHENTIK_API_TOKEN in .env}
      AI_HUB_AUTHENTIK_PROVIDER_TEMPLATE_CLIENT_ID: ${AI_HUB_AUTHENTIK_PROVIDER_TEMPLATE_CLIENT_ID:-ai-hub-platform}
      AI_HUB_CREDENTIAL_ROTATION_OVERLAP_SECONDS: ${AI_HUB_CREDENTIAL_ROTATION_OVERLAP_SECONDS:-300}
      AI_HUB_PUBLIC_ASSET_ROOT: ${AI_HUB_PUBLIC_ASSET_ROOT:-/workspace/public-assets}
      AI_HUB_PUBLIC_PLATFORM_BASE_URL: ${AI_HUB_PUBLIC_PLATFORM_BASE_URL:-http://platform.localhost:8088}
      AI_HUB_PUBLIC_IDENTITY_BASE_URL: ${AI_HUB_PUBLIC_IDENTITY_BASE_URL:-http://auth.localhost:8088}
      AI_HUB_SANDBOX_APPLICATION_ID: ${AI_HUB_SANDBOX_APPLICATION_ID:-standalone-example}
      AI_HUB_SANDBOX_USER_SUBJECT: ${AI_HUB_SANDBOX_USER_SUBJECT:-ai-hub-demo-user}
      AI_HUB_STANDALONE_PORTAL_URL: ${AI_HUB_STANDALONE_PORTAL_URL:-http://app.localhost:8088/}
      AI_HUB_STANDALONE_API_BASE_URL: ${AI_HUB_STANDALONE_API_BASE_URL:-http://app.localhost:8088/api/v1}
      AI_HUB_STANDALONE_HEALTH_URL: ${AI_HUB_STANDALONE_HEALTH_URL:-http://app.localhost:8088/health/live}
      AI_HUB_STANDALONE_OIDC_REDIRECT_URI: ${AI_HUB_STANDALONE_OIDC_REDIRECT_URI:-http://app.localhost:8088/auth/callback}
      AI_HUB_MONITOR_TOKEN: ${AI_HUB_MONITOR_TOKEN:?Set AI_HUB_MONITOR_TOKEN in .env}
      AI_HUB_PRODUCTION_TARGETS_PATH: ${AI_HUB_PRODUCTION_TARGETS_PATH:-deploy/operations/production-targets.json}
      AI_HUB_RAW_DATABASE_URL: postgresql+psycopg://ai_hub_raw:${AI_HUB_RAW_DB_PASSWORD:?Set AI_HUB_RAW_DB_PASSWORD in .env}@postgres:5432/platform_db
      AI_HUB_OIDC_CLIENT_ID: ${AI_HUB_OIDC_CLIENT_ID:-ai-hub-platform}
      AI_HUB_OIDC_CLIENT_SECRET: ${AI_HUB_OIDC_CLIENT_SECRET:?Set AI_HUB_OIDC_CLIENT_SECRET in .env}
    healthcheck:
      # Gate dependents on readiness, not liveness: /health/ready only reports
      # OK once the bootstrap credential reconciliation has produced a usable
      # provider binding, so dependent services never start against a platform
      # that would reject their tokens with invalid_issuer.
      # The start window must cover Authentik blueprint lag after authentik-server
      # is healthy: reconciliation retries sleep 5/10/20/30s between attempts, so
      # a short start_period marks the API unhealthy before the dedicated
      # provider appears (M1 compose --wait then fails).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s
    depends_on:
      platform-core-migrate:
        condition: service_completed_successfully
      authentik-server:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:${AI_HUB_INTERNAL_API_PORT:-18080}:8000"
    restart: unless-stopped

  portal:
    profiles: *core-profiles
    image: "${AI_HUB_PORTAL_IMAGE_REF:-ai-hub-portal:local}"
    build:
      context: ..
      dockerfile: deploy/docker/portal.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.18.1-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  standalone-migrate:
    profiles: *core-profiles
    image: "${STANDALONE_APP_IMAGE_REF:-ai-hub-standalone-example:local}"
    build:
      context: ..
      dockerfile: examples/standalone-app/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.7-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc}
        UV_VERSION: ${UV_VERSION:-0.9.8}
    command: ["alembic", "-c", "/workspace/examples/standalone-app/alembic.ini", "upgrade", "head"]
    environment:
      STANDALONE_ENVIRONMENT: ${STANDALONE_ENVIRONMENT:-local}
      STANDALONE_MIGRATION_DATABASE_URL: postgresql+psycopg://standalone_app_migrator:${STANDALONE_MIGRATOR_DB_PASSWORD:?Set STANDALONE_MIGRATOR_DB_PASSWORD in .env}@postgres:5432/standalone_app_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  standalone-app:
    <<: *standalone-app-common
    profiles: *core-profiles
    environment:
      <<: *standalone-app-environment
      STANDALONE_INTEGRATION_CAPABILITIES: API_CLIENT,DATA_INGEST
    depends_on:
      standalone-migrate:
        condition: service_completed_successfully
      platform-api:
        condition: service_healthy
    networks:
      default:
        aliases:
          - standalone-app

  authentik-storage-init:
    profiles: *core-profiles
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868}
    user: "0:0"
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        from pathlib import Path

        data = Path("/data")
        media = Path("/data/media")
        if media.is_symlink():
            if media.readlink() != Path("/media"):
                raise RuntimeError("refusing to replace an unexpected /data/media link")
            media.unlink()
        media.mkdir(parents=True, exist_ok=True)
        os.chown(data, 1000, 1000)
        os.chown(media, 1000, 1000)
    volumes:
      - type: volume
        source: authentik-data
        target: /data
        volume:
          nocopy: true
    restart: "no"

  authentik-server:
    profiles: *core-profiles
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868}
    command: server
    environment:
      <<: *authentik-environment
    depends_on:
      postgres:
        condition: service_healthy
      authentik-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - type: volume
        source: authentik-data
        target: /data
        volume:
          nocopy: true
    shm_size: 512mb
    restart: unless-stopped

  authentik-worker:
    profiles: *core-profiles
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868}
    command: worker
    environment:
      <<: *authentik-environment
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@ai-hub.local}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?Set AUTHENTIK_BOOTSTRAP_PASSWORD in .env}
      AI_HUB_OIDC_CLIENT_SECRET: ${AI_HUB_OIDC_CLIENT_SECRET:?Set AI_HUB_OIDC_CLIENT_SECRET in .env}
      AI_HUB_DEMO_USER_PASSWORD: ${AI_HUB_DEMO_USER_PASSWORD:?Set AI_HUB_DEMO_USER_PASSWORD in .env}
      AI_HUB_UAT_USER_PASSWORD: ${AI_HUB_UAT_USER_PASSWORD:?Set AI_HUB_UAT_USER_PASSWORD in .env}
      AI_HUB_PORTAL_OIDC_CLIENT_SECRET: ${AI_HUB_PORTAL_OIDC_CLIENT_SECRET:?Set AI_HUB_PORTAL_OIDC_CLIENT_SECRET in .env}
      AI_HUB_PORTAL_OIDC_REDIRECT_URI: ${AI_HUB_PORTAL_OIDC_REDIRECT_URI:-http://platform.localhost:8088/auth/callback}
      AI_HUB_PORTAL_OIDC_LOGOUT_REDIRECT_URI: ${AI_HUB_PORTAL_OIDC_LOGOUT_REDIRECT_URI:-http://platform.localhost:8088/}
      AI_HUB_AUTHENTIK_API_TOKEN: ${AI_HUB_AUTHENTIK_API_TOKEN:?Set AI_HUB_AUTHENTIK_API_TOKEN in .env}
      AI_HUB_AUTHENTIK_BRAND_DOMAIN: ${AI_HUB_AUTHENTIK_BRAND_DOMAIN:-auth.localhost:8088}
      STANDALONE_OIDC_REDIRECT_URI: ${STANDALONE_OIDC_REDIRECT_URI:-http://app.localhost:8088/auth/callback}
      STANDALONE_OIDC_CLIENT_SECRET: ${STANDALONE_OIDC_CLIENT_SECRET:?Set STANDALONE_OIDC_CLIENT_SECRET in .env}
      STANDALONE_PORTAL_URL: ${STANDALONE_PORTAL_URL:-http://app.localhost:8088/}
      AI_HUB_PORTAL_EXTERNAL_URL: ${AI_HUB_PORTAL_EXTERNAL_URL:-http://platform.localhost:8088}
    depends_on:
      postgres:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - type: volume
        source: authentik-data
        target: /data
        volume:
          nocopy: true
      - ./authentik/ai-hub-blueprint.yaml:/blueprints/ai-hub/ai-hub-blueprint.yaml:ro
    shm_size: 512mb
    restart: unless-stopped

  traefik:
    profiles: *core-profiles
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac}
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    ports:
      - "${AI_HUB_EDGE_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      authentik-server:
        condition: service_healthy
      platform-api:
        condition: service_healthy
      portal:
        condition: service_healthy
      standalone-app:
        condition: service_healthy
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    networks:
      default:
        aliases:
          - auth.localhost
          - platform.localhost
          - app.localhost
    init: true
    restart: unless-stopped

  platform-ingest-scheduler:
    profiles: *core-profiles
    image: "${AI_HUB_PLATFORM_IMAGE_REF:-ai-hub-platform:local}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.7-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc}
        UV_VERSION: ${UV_VERSION:-0.9.8}
    command: ["ai-hub-ingest-scheduler"]
    environment:
      AI_HUB_ENVIRONMENT: ${AI_HUB_ENVIRONMENT:-local}
      AI_HUB_RAW_DATABASE_URL: postgresql+psycopg://ai_hub_raw:${AI_HUB_RAW_DB_PASSWORD:?Set AI_HUB_RAW_DB_PASSWORD in .env}@postgres:5432/platform_db
      AI_HUB_INGEST_SOURCES_PATH: ${AI_HUB_INGEST_SOURCES_PATH:-deploy/operations/ingest-sources.json}
      AI_HUB_OIDC_ISSUER: ${STANDALONE_OIDC_ISSUER:-http://auth.localhost:8088/application/o/standalone-example/}
      AI_HUB_OIDC_CLIENT_ID: ${STANDALONE_OIDC_CLIENT_ID:-standalone-example}
      AI_HUB_OIDC_CLIENT_SECRET: ${STANDALONE_OIDC_CLIENT_SECRET:?Set STANDALONE_OIDC_CLIENT_SECRET in .env}
      AI_HUB_SEED_DATABASE_URL: postgresql+psycopg://ai_hub_platform_migrator:${AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD:?Set AI_HUB_PLATFORM_MIGRATOR_DB_PASSWORD in .env}@postgres:5432/platform_db
      AI_HUB_TICK_INTERVAL_SECONDS: ${AI_HUB_INGEST_TICK_INTERVAL_SECONDS:-1}
      AI_HUB_HTTP_TIMEOUT_SECONDS: ${AI_HUB_INGEST_HTTP_TIMEOUT_SECONDS:-30}
      AI_HUB_MAX_CONCURRENT_SOURCES: ${AI_HUB_INGEST_MAX_CONCURRENT_SOURCES:-4}
      AI_HUB_MAX_CONCURRENT_PER_APPLICATION: ${AI_HUB_INGEST_MAX_CONCURRENT_PER_APPLICATION:-2}
    depends_on:
      platform-raw-migrate:
        condition: service_completed_successfully
      authentik-server:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  authentik-data:
