global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":8088"
    forwardedHeaders:
      insecure: false
  ping:
    address: ":8082"

ping:
  entryPoint: ping

api:
  dashboard: false

log:
  format: json
  level: INFO

accessLog:
  format: json

providers:
  file:
    filename: /etc/traefik/dynamic.yaml
    watch: true
