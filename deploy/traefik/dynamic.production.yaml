http:
  middlewares:
    common-security:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
    request-limit:
      buffering:
        maxRequestBodyBytes: 10485760

  routers:
    authentik:
      entryPoints: [websecure]
      rule: Host(`{{ env "AI_HUB_AUTH_HOST" }}`)
      service: authentik
      middlewares: [common-security, request-limit]
      tls:
        certResolver: letsencrypt
    platform-api:
      entryPoints: [websecure]
      rule: Host(`{{ env "AI_HUB_PLATFORM_HOST" }}`) && (PathPrefix(`/platform-api/`) || PathPrefix(`/portal-api/`) || PathPrefix(`/auth/`) || PathPrefix(`/health/`))
      priority: 100
      service: platform-api
      middlewares: [common-security, request-limit]
      tls:
        certResolver: letsencrypt
    platform-portal:
      entryPoints: [websecure]
      rule: Host(`{{ env "AI_HUB_PLATFORM_HOST" }}`)
      priority: 10
      service: platform-portal
      middlewares: [common-security, request-limit]
      tls:
        certResolver: letsencrypt
    standalone-app:
      entryPoints: [websecure]
      rule: Host(`{{ env "AI_HUB_APP_HOST" }}`)
      service: standalone-app
      middlewares: [common-security, request-limit]
      tls:
        certResolver: letsencrypt

  services:
    authentik:
      loadBalancer:
        healthCheck:
          path: /-/health/ready/
          interval: 10s
          timeout: 3s
        servers:
          - url: http://authentik-server:9000
    platform-api:
      loadBalancer:
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s
        servers:
          - url: http://platform-api:8000
    platform-portal:
      loadBalancer:
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        servers:
          - url: http://portal:8080
    standalone-app:
      loadBalancer:
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s
        servers:
          - url: http://standalone-app:8100
