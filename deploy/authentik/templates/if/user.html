{% extends "base/skeleton.html" %}
{% load authentik_core %}

{% block head %}
{% include "base/header_js.html" %}
<script>
// Only the user interface is customized. OIDC and flow templates stay upstream.
(() => {
    const portal = "{{ request.brand.attributes.ai_hub_portal_url|escapejs }}";
    const interfaceScript = "{% versioned_script 'dist/user/UserInterface-%v.js' %}";
    let loaded = false;
    function unavailablePortal() {
        document.documentElement.hidden = false;
        const showError = () => {
            document.body.textContent = "AI Hub 门户地址未正确配置，请联系平台管理员。";
        };
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", showError, { once: true });
        else showError();
    }
    function routeUserInterface() {
        const route = window.location.hash.slice(1).split(/[?;]/, 1)[0].replace(/\/+$/, "");
        const directory = ["", "/", "/library"].includes(route);
        document.documentElement.hidden = directory;
        if (directory) {
            let target;
            try { target = new URL(portal); } catch { unavailablePortal(); return; }
            if (!["http:", "https:"].includes(target.protocol) || target.origin === window.location.origin) { unavailablePortal(); return; }
            // An explicit fragment prevents browsers retaining #/library on arrival.
            target.hash = "";
            window.location.replace(target.href + "#");
            return;
        }
        if (!loaded) {
            loaded = true;
            const script = document.createElement("script");
            script.type = "module";
            script.src = interfaceScript;
            document.head.appendChild(script);
        }
    }
    window.addEventListener("hashchange", routeUserInterface);
    routeUserInterface();
})();
</script>
{% endblock %}

{% block body %}
<ak-skip-to-content></ak-skip-to-content>
<ak-message-container></ak-message-container>
<ak-interface-user>
    {% include "base/placeholder.html" %}
</ak-interface-user>
<noscript>请启用 JavaScript，或打开 <a href="{{ request.brand.attributes.ai_hub_portal_url }}">AI Hub 平台门户</a>。</noscript>
{% endblock %}
