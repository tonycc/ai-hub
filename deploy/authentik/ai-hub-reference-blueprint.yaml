version: 1
metadata:
  name: AI Hub local and CI reference identities
  labels:
    blueprints.goauthentik.io/instantiate: "true"

# This blueprint is mounted only by the local/CI base compose file. The
# production overlay removes the mount so reference providers and UAT users
# cannot be created in a production identity tenant.
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: standalone-example-oauth-provider
    identifiers:
      name: standalone-example
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: standalone-example
      client_secret: !Env STANDALONE_OIDC_CLIENT_SECRET
      issuer_mode: per_provider
      sub_mode: user_username
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: hours=8
      grant_types:
        - authorization_code
        - client_credentials
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Env [STANDALONE_OIDC_REDIRECT_URI, http://app.localhost:8088/auth/callback]
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub identity claims]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub platform.me.read]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub platform.application.read]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub platform.authorization.decide]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub platform.notification.request]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub platform.application.health.write]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, AI Hub ai_hub.ingest.export]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: standalone-example
    attrs:
      name: Standalone Reference Application
      provider: !KeyOf standalone-example-oauth-provider
      meta_launch_url: !Env [STANDALONE_PORTAL_URL, http://app.localhost:8088/]
      open_in_new_tab: false

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-demo-user
    attrs:
      name: AI Hub Demo User
      email: demo-user@ai-hub.local
      type: internal
      password: !Env AI_HUB_DEMO_USER_PASSWORD
      attributes:
        authorization_version: 1

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-app-developer
    attrs:
      name: 应用开发者
      email: app-developer@ai-hub.local
      type: internal
      password: !Env AI_HUB_UAT_USER_PASSWORD
      attributes:
        authorization_version: 1

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-platform-ingest-operator
    attrs:
      name: 数据接入运维员
      email: platform-ingest-operator@ai-hub.local
      type: internal
      password: !Env AI_HUB_INGEST_OPERATOR_PASSWORD
      attributes:
        authorization_version: 1
