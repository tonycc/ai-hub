version: 1
metadata:
  name: AI Hub identity and M3 portal baseline
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Keep the identity provider as the authentication authority, while making
  # its hosted flow feel like a native AI Hub platform entry point.
  - model: authentik_brands.brand
    id: ai-hub-auth-brand
    state: present
    identifiers:
      domain: !Env [AI_HUB_AUTHENTIK_BRAND_DOMAIN, auth.localhost:8088]
    attrs:
      branding_title: AI Hub 平台门户
      branding_custom_css: |
        :host {
          --ak-c-login__main-ColumnWidth: min(30rem, calc(100vw - 3rem));
          --ak-c-login__main--BackgroundColor: #ffffff;
          --ak-c-login--BackgroundColorOverlay: #eef1f4;
          --pf-global--primary-color--100: #c95724;
          --pf-global--primary-color--200: #a64a21;
          --pf-global--link--Color: #a64a21;
          --pf-global--link--Color--hover: #c95724;
          --pf-global--FontFamily--sans-serif: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
          --pf-global--FontFamily--heading--sans-serif: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }

        .pf-c-login {
          background: #eef1f4;
        }

        .pf-c-login::before {
          background: linear-gradient(90deg, #17232d 0 31%, #eef1f4 31% 100%) !important;
        }

        .pf-c-login__header {
          position: relative;
          z-index: 1;
          min-height: 8rem;
          padding: 2rem 2.5rem;
          align-content: start;
          justify-items: start;
        }

        ak-locale-select {
          display: none !important;
        }

        .pf-c-login__header::before {
          display: block;
          color: #17232d;
          content: "AI Hub";
          font-size: 1.5rem;
          font-weight: 750;
          letter-spacing: -0.02em;
          line-height: 1.2;
        }

        .pf-c-login__header::after {
          display: block;
          margin-top: 0.35rem;
          color: #71808c;
          content: "平台门户 · 统一身份认证";
          font-size: 0.75rem;
          letter-spacing: 0.08em;
        }

        .pf-c-login__main {
          align-self: center;
          border: 1px solid #dfe5e9;
          border-radius: 0.75rem;
          box-shadow: 0 1rem 2.5rem rgb(20 33 43 / 12%);
        }

        .pf-c-login__main-header.pf-c-brand {
          display: none;
        }

        .pf-c-login__main-header .pf-c-title {
          color: #1f2a33;
          font-weight: 700;
          letter-spacing: -0.03em;
        }

        .pf-c-login__main-header .pf-c-title {
          font-size: 0;
        }

        .pf-c-login__main-header .pf-c-title::after {
          content: "登录 AI Hub 平台门户";
          font-size: 1.65rem;
        }

        .pf-c-login__main-body {
          color: #71808c;
        }

        .pf-c-form > p {
          font-size: 0;
        }

        .pf-c-form > p::after {
          content: "使用企业账号访问平台能力与应用服务";
          font-size: 0.875rem;
        }

        .pf-c-form__label[for="ak-identifier-input"] .pf-c-form__label-text {
          font-size: 0;
        }

        .pf-c-form__label[for="ak-identifier-input"] .pf-c-form__label-text::after {
          content: "账号或邮箱";
          font-size: 0.875rem;
        }

        .pf-c-form__label[for="ak-identifier-input"][aria-required="true"] .pf-c-form__label-text::after {
          content: "账号或邮箱 *";
          margin-left: 0;
          font-size: 0.875rem;
        }

        .pf-c-form-control {
          border-color: #cbd5db;
          border-radius: 0.375rem;
          background: #ffffff;
          color: #1f2a33;
        }

        .pf-c-form-control:focus {
          border-color: #c95724;
          box-shadow: 0 0 0 0.2rem rgb(201 87 36 / 14%);
        }

        .pf-c-button.pf-m-primary {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 2.75rem;
          padding: 0.75rem 1rem;
          border-radius: 0.375rem;
          background: #c95724;
          font-weight: 650;
          font-size: 0;
          line-height: 1.25;
        }

        .pf-c-button.pf-m-primary::after {
          display: inline-block;
          content: "登录";
          font-size: 0.875rem;
          line-height: 1.25;
        }

        .pf-c-button.pf-m-primary:hover,
        .pf-c-button.pf-m-primary:focus {
          background: #a64a21;
        }

        .pf-c-login__footer .pf-c-list {
          color: #71808c;
          font-size: 0;
        }

        .pf-c-login__footer .pf-c-list li {
          font-size: 0;
        }

        .pf-c-login__footer .pf-c-list li::after {
          content: "AI Hub 统一身份服务";
          font-size: 0.75rem;
        }

        ::slotted(ak-brand-links) {
          display: none !important;
        }

        @media (max-width: 48rem) {
          .pf-c-login::before {
            background: #eef1f4 !important;
          }

          .pf-c-login__header {
            min-height: 5rem;
            padding: 1.5rem;
          }

          .pf-c-login__header::before {
            color: #17232d;
          }

          .pf-c-login__header::after {
            color: #71808c;
          }
        }

  - model: authentik_flows.flow
    id: ai-hub-default-authentication-flow
    state: present
    identifiers:
      slug: default-authentication-flow
    attrs:
      name: AI Hub 平台门户登录
      title: 登录 AI Hub 平台门户

  - model: authentik_stages_identification.identificationstage
    id: ai-hub-default-authentication-identification
    state: present
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]

  # The password stage is rendered inside the identification challenge above;
  # remove the legacy second binding so the flow does not ask for a password twice.
  - model: authentik_flows.flowstagebinding
    id: ai-hub-default-authentication-password-binding
    state: absent
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]

  # A portal logout also terminates the upstream Authentik browser session,
  # preventing the next authorization request from silently signing in again.
  - model: authentik_flows.flowstagebinding
    id: ai-hub-provider-invalidation-logout
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
    attrs:
      order: 0

  - model: authentik_providers_oauth2.scopemapping
    id: ai-hub-identity-scope
    identifiers:
      name: AI Hub identity claims
    attrs:
      scope_name: ai_hub.identity
      description: Stable actor type, application identity and authorization version.
      expression: |
        actor_type = "service" if request.user.type == "service_account" else "user"
        claims = {
            "actor_type": actor_type,
            "authorization_version": request.user.attributes.get("authorization_version", 1),
        }
        if actor_type == "service":
            application_id = request.user.attributes.get("application_id")
            if not application_id:
                username = request.user.username
                if username == "ak-ai-hub-platform-client_credentials":
                    application_id = "standalone-example"
                elif username.startswith("ak-") and username.endswith("-client_credentials"):
                    application_id = username[3:-19].split("__", 1)[0]
            claims["application_id"] = application_id
        return claims

  - model: authentik_providers_oauth2.scopemapping
    id: platform-portal-access-scope
    identifiers:
      name: AI Hub platform.portal.access
    attrs:
      scope_name: platform.portal.access
      description: Establish a short-lived server-side platform management session.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: platform-me-read-scope
    identifiers:
      name: AI Hub platform.me.read
    attrs:
      scope_name: platform.me.read
      description: Read the current platform user and effective authorization snapshot.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: platform-application-read-scope
    identifiers:
      name: AI Hub platform.application.read
    attrs:
      scope_name: platform.application.read
      description: Read an application registration and its environment entry.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: platform-authorization-decide-scope
    identifiers:
      name: AI Hub platform.authorization.decide
    attrs:
      scope_name: platform.authorization.decide
      description: Request a registered platform authorization decision.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: platform-notification-request-scope
    identifiers:
      name: AI Hub platform.notification.request
    attrs:
      scope_name: platform.notification.request
      description: Request and query notifications for the calling application.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: platform-application-health-scope
    identifiers:
      name: AI Hub platform.application.health.write
    attrs:
      scope_name: platform.application.health.write
      description: Trigger a health check for the calling application registration.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: ai-hub-ingest-export-scope
    identifiers:
      name: AI Hub ai_hub.ingest.export
    attrs:
      scope_name: ai_hub.ingest.export
      description: Pull application export APIs for platform incremental ingest.
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: platform-data-read-scope
    identifiers:
      name: AI Hub platform.data.read
    attrs:
      scope_name: platform.data.read
      description: Read aggregated application current-state and change history.
      expression: "return {}"

  - model: authentik_providers_oauth2.oauth2provider
    id: ai-hub-oauth-provider
    identifiers:
      name: ai-hub-platform
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: ai-hub-platform
      client_secret: !Env AI_HUB_OIDC_CLIENT_SECRET
      issuer_mode: per_provider
      sub_mode: user_username
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: hours=8
      grant_types:
        - authorization_code
        - client_credentials
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Env [STANDALONE_OIDC_REDIRECT_URI, http://app.localhost:8088/auth/callback]
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf ai-hub-identity-scope
        - !KeyOf platform-me-read-scope
        - !KeyOf platform-application-read-scope
        - !KeyOf platform-authorization-decide-scope
        - !KeyOf platform-notification-request-scope
        - !KeyOf platform-application-health-scope
        - !KeyOf ai-hub-ingest-export-scope
        - !KeyOf platform-data-read-scope
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: ai-hub
    attrs:
      name: AI Hub Platform
      provider: !KeyOf ai-hub-oauth-provider
      meta_launch_url: !Env [AI_HUB_PORTAL_EXTERNAL_URL, http://platform.localhost:8088]
      open_in_new_tab: false

  - model: authentik_providers_oauth2.oauth2provider
    id: ai-hub-portal-oauth-provider
    identifiers:
      name: ai-hub-portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: ai-hub-portal
      client_secret: !Env AI_HUB_PORTAL_OIDC_CLIENT_SECRET
      issuer_mode: per_provider
      sub_mode: user_username
      access_code_validity: minutes=1
      access_token_validity: minutes=15
      refresh_token_validity: hours=1
      grant_types:
        - authorization_code
      redirect_uris:
        - matching_mode: strict
          url: !Env [AI_HUB_PORTAL_OIDC_REDIRECT_URI, http://platform.localhost:8088/auth/callback]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Env [AI_HUB_PORTAL_OIDC_LOGOUT_REDIRECT_URI, http://platform.localhost:8088/]
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf ai-hub-identity-scope
        - !KeyOf platform-portal-access-scope
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: ai-hub-portal
    attrs:
      name: AI Hub Platform Portal
      provider: !KeyOf ai-hub-portal-oauth-provider
      meta_launch_url: !Env [AI_HUB_PORTAL_EXTERNAL_URL, http://platform.localhost:8088]
      open_in_new_tab: false

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-demo-user
    attrs:
      name: AI Hub Demo User
      email: demo-user@ai-hub.local
      type: internal
      password: !Env AI_HUB_DEMO_USER_PASSWORD
      attributes:
        authorization_version: 1

  - model: authentik_core.user
    id: ai-hub-authentik-automation-user
    state: present
    identifiers:
      username: ai-hub-authentik-automation
    attrs:
      name: AI Hub authentik automation
      type: service_account
      permissions:
        - authentik_providers_oauth2.view_oauth2provider
        - authentik_providers_oauth2.add_oauth2provider
        - authentik_providers_oauth2.change_oauth2provider
        - authentik_providers_oauth2.delete_oauth2provider
        - authentik_providers_oauth2.view_scopemapping
        - authentik_core.view_application
        - authentik_core.add_application
        - authentik_core.change_application
        - authentik_core.delete_application

  - model: authentik_core.token
    state: present
    identifiers:
      identifier: ai-hub-authentik-automation
    attrs:
      key: !Env AI_HUB_AUTHENTIK_API_TOKEN
      user: !KeyOf ai-hub-authentik-automation-user
      intent: api
      description: Least-privilege token for AI Hub application credential lifecycle.
      expiring: false

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-platform-admin
    attrs:
      name: Platform Administrator
      email: platform-admin@ai-hub.local
      type: internal
      password: !Env AI_HUB_UAT_USER_PASSWORD
      attributes:
        authorization_version: 1

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-app-developer
    attrs:
      name: Application Developer
      email: app-developer@ai-hub.local
      type: internal
      password: !Env AI_HUB_UAT_USER_PASSWORD
      attributes:
        authorization_version: 1

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-security-auditor
    attrs:
      name: Security Auditor
      email: security-auditor@ai-hub.local
      type: internal
      password: !Env AI_HUB_UAT_USER_PASSWORD
      attributes:
        authorization_version: 1

  - model: authentik_core.user
    state: created
    identifiers:
      username: ai-hub-platform-operator
    attrs:
      name: Platform Operator
      email: platform-operator@ai-hub.local
      type: internal
      password: !Env AI_HUB_UAT_USER_PASSWORD
      attributes:
        authorization_version: 1
