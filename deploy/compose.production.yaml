name: ai-hub-production
#
# Production overlay (M8-03): HTTPS edge via Traefik ACME (Let's Encrypt).
#
# Layer on top of deploy/compose.yaml:
#   docker compose \
#     --env-file /etc/ai-hub/runtime.env \
#     -f deploy/compose.yaml \
#     -f deploy/compose.production.yaml \
#     --profile base-access up -d
#
# It changes the edge (Traefik), public hostname wiring, and disables the
# neutral reference application/UAT identities. Historical reference rows are
# retained but quarantined by platform-api; no production business data is
# deleted by this overlay.
# Required env (from /etc/ai-hub/runtime.env or the deploy environment):
#   AI_HUB_PLATFORM_HOST   public portal/API host, e.g. platform.example.internal
#   AI_HUB_AUTH_HOST       public identity host,  e.g. auth.example.internal
#   AI_HUB_ACME_EMAIL      ACME account email for Let's Encrypt

services:
  platform-api:
    environment:
      AI_HUB_REFERENCE_APPLICATION_ENABLED: "false"

  platform-ingest-scheduler:
    environment:
      AI_HUB_OIDC_ISSUER: ${AI_HUB_OIDC_ISSUER:?Set AI_HUB_OIDC_ISSUER}
      AI_HUB_OIDC_CLIENT_ID: ${AI_HUB_OIDC_CLIENT_ID:?Set AI_HUB_OIDC_CLIENT_ID}
      AI_HUB_OIDC_CLIENT_SECRET: ${AI_HUB_OIDC_CLIENT_SECRET:?Set AI_HUB_OIDC_CLIENT_SECRET}

  standalone-migrate:
    profiles: !override
      - reference-app

  standalone-app:
    profiles: !override
      - reference-app

  authentik-worker:
    volumes: !override
      - type: volume
        source: authentik-data
        target: /data
        volume:
          nocopy: true
      - type: bind
        source: ./authentik/ai-hub-blueprint.yaml
        target: /blueprints/ai-hub/ai-hub-blueprint.yaml
        read_only: true
      - type: bind
        source: ./authentik/ai-hub-production-blueprint.yaml
        target: /blueprints/ai-hub/ai-hub-production-blueprint.yaml
        read_only: true

  traefik:
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AI_HUB_PLATFORM_HOST: ${AI_HUB_PLATFORM_HOST:?Set AI_HUB_PLATFORM_HOST}
      AI_HUB_AUTH_HOST: ${AI_HUB_AUTH_HOST:?Set AI_HUB_AUTH_HOST}
    depends_on: !override
      authentik-server:
        condition: service_healthy
      platform-api:
        condition: service_healthy
      portal:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./traefik/traefik.production.yaml
        target: /etc/traefik/traefik.yaml
        read_only: true
      - type: bind
        source: ./traefik/dynamic.production.yaml
        target: /etc/traefik/dynamic.yaml
        read_only: true
      - type: volume
        source: traefik-acme
        target: /etc/traefik/acme
    networks:
      default:
        aliases: !override
          - ${AI_HUB_PLATFORM_HOST:?Set AI_HUB_PLATFORM_HOST}
          - ${AI_HUB_AUTH_HOST:?Set AI_HUB_AUTH_HOST}

volumes:
  traefik-acme:
