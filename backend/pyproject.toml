[project]
name = "ai-hub-platform-backend"
version = "0.1.0"
description = "AI Hub modular platform backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ai-hub-sdk",
  "aio-pika>=9.5,<10",
  "alembic>=1.16,<2",
  "cryptography>=46,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
ai-hub-sdk = { workspace = true }

[dependency-groups]
dev = [
  "import-linter>=2.3,<3",
  "jsonschema>=4.25,<5",
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pyyaml>=6,<7",
  "ruff>=0.12",
]

[project.scripts]
ai-hub-api = "ai_hub_platform.cli:run"
ai-hub-projection-worker = "ai_hub_platform.cli:run_projection_worker_cli"
ai-hub-projection-rebuild = "ai_hub_platform.cli:run_projection_rebuild_cli"
ai-hub-projection-reconcile = "ai_hub_platform.cli:run_projection_reconcile_cli"
ai-hub-conformance-evidence-import = "ai_hub_platform.cli:run_conformance_evidence_import_cli"
ai-hub-backup = "ai_hub_platform.operations.backup:main"
ai-hub-monitor = "ai_hub_platform.operations.monitor:main"
ai-hub-release = "ai_hub_platform.operations.release:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hub_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
