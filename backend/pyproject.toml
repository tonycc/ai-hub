[project]
name = "ai-hub-platform-backend"
version = "0.1.0"
description = "AI Hub modular platform backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika>=9.5,<10",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "import-linter>=2.3,<3",
  "jsonschema>=4.25,<5",
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pyyaml>=6,<7",
  "ruff>=0.12",
]

[project.scripts]
ai-hub-api = "ai_hub_platform.cli:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hub_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
