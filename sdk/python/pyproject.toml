[project]
name = "ai-hub-sdk"
version = "0.2.0"
description = "Python client and integration contracts for AI Hub"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hub_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
