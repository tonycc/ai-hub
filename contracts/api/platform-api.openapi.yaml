openapi: 3.1.0
info:
  title: AI Hub Platform API
  version: 0.2.1
  description: |
    Versioned public identity, authorization, application, notification, aggregated data, and health API.

    **Authentication:** Bearer access token from authentik OIDC. Every protected operation requires scope `ai_hub.identity` plus the operation-specific scopes listed on each path.

    **Application context:** Send `X-Application-ID` when the operation is scoped to a registered application (see parameter descriptions).

    **Errors:** Failures return `ErrorResponse` with stable `error_code` values. Propagate `X-Request-ID` / `X-Trace-ID` on outbound calls for audit correlation.

    **Not in this contract:** Application-side ingest export (`GET /ai-hub/export`) is defined by the integrating app. See `docs/agent-integration.md` and SDK `ExportPage`.
servers:
  - url: https://platform.example.internal
security:
  - oidcAuth: [ai_hub.identity]
paths:
  /health/live:
    get:
      operationId: getPlatformLiveness
      summary: Liveness probe
      description: Returns 200 when the platform process is running. No authentication required. Use for load balancer / orchestrator liveness checks.
      tags: [health]
      security: []
      responses:
        "200":
          description: Platform process is alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
  /health/ready:
    get:
      operationId: getPlatformReadiness
      summary: Readiness probe
      description: Returns 200 when the platform can serve requests (database reachable). No authentication required.
      tags: [health]
      security: []
      responses:
        "200":
          description: Platform database dependency is ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
  /platform-api/v1/me:
    get:
      operationId: getCurrentPlatformUser
      summary: Current platform user
      description: |
        Resolve the caller's platform user id, organization, and authorization version.
        Call after locally validating the user JWT (issuer, audience, signature, expiry, scopes).
        Optional `X-Application-ID` ties the request to a registered application for audit context.
      tags: [identity]
      security:
        - oidcAuth: [ai_hub.identity, platform.me.read]
      parameters:
        - {$ref: "#/components/parameters/ApplicationId"}
      responses:
        "200":
          description: Stable platform user and organization mapping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform-api/v1/me/permissions:
    get:
      operationId: getCurrentUserPermissions
      summary: Authorization snapshot
      description: |
        Short-lived, versioned permission and data-scope snapshot for the caller within one application.
        Requires `X-Application-ID`. Cache only until `expires_at`; re-fetch when `authorization_version` changes.
        Use for low-risk reads when online re-validation is acceptable within the expiry window.
      tags: [authorization]
      security:
        - oidcAuth: [ai_hub.identity, platform.me.read]
      parameters:
        - {$ref: "#/components/parameters/RequiredApplicationId"}
      responses:
        "200":
          description: Versioned, short-lived authorization snapshot for an application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PermissionSnapshot"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform-api/v1/authorization/decisions:
    post:
      operationId: createAuthorizationDecision
      summary: Online authorization decision
      description: |
        Synchronous allow/deny decision for a registered high-risk permission.
        Prefer this over cached snapshots for mutating or sensitive operations.
        Default `risk` is `high`; set `low` only when the permission is registered as low risk.
      tags: [authorization]
      security:
        - oidcAuth: [ai_hub.identity, platform.authorization.decide]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorizationDecisionRequest"}
      responses:
        "200":
          description: Online decision for a registered high-risk permission.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthorizationDecision"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform-api/v1/applications/{application_id}:
    get:
      operationId: getApplicationRegistration
      summary: Application registration
      description: |
        Fetch application metadata, declared capabilities (`API_CLIENT`, `DATA_INGEST`), and per-environment entry URLs.
        Caller must be authorized for the requested `application_id`.
      tags: [applications]
      security:
        - oidcAuth: [ai_hub.identity, platform.application.read]
      parameters:
        - {$ref: "#/components/parameters/ApplicationPathId"}
      responses:
        "200":
          description: Application registration, capabilities, and environment entry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApplicationRegistration"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /platform-api/v1/applications/{application_id}/environments/{environment}/health-check:
    post:
      operationId: checkApplicationEnvironmentHealth
      summary: Report environment health
      description: |
        Probe the registered environment `health_url` and persist HEALTHY / UNHEALTHY for operations dashboards.
        Typically invoked by the application's own monitor or CI using a service token with `platform.application.health.write`.
      tags: [applications]
      security:
        - oidcAuth: [ai_hub.identity, platform.application.health.write]
      parameters:
        - {$ref: "#/components/parameters/ApplicationPathId"}
        - name: environment
          in: path
          required: true
          description: Registered environment slug (for example `dev`, `staging`, `prod`).
          schema: {type: string}
      responses:
        "200":
          description: Persisted health result for the registered environment.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [HEALTHY, UNHEALTHY]
                    description: Result of the outbound probe to the environment health URL.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /platform-api/v1/notifications:
    post:
      operationId: createNotification
      summary: Create notification (idempotent)
      description: |
        Request a local IN_APP test notification. **Idempotent on `idempotency_key`** within the application scope—retries must reuse the same key.
        `DELIVERED` means accepted by the local test channel only; external email/SMS providers are not used.
        Requires service token with `platform.notification.request`.
      tags: [notifications]
      security:
        - oidcAuth: [ai_hub.identity, platform.notification.request]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationRequest"}
      responses:
        "201":
          description: Idempotent local IN_APP test notification result. DELIVERED does not represent delivery by an external email, SMS, or collaboration provider.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform-api/v1/notifications/{notification_id}:
    get:
      operationId: getNotification
      summary: Get notification status
      description: Poll delivery status for a notification created by the same application. Cross-application access is denied.
      tags: [notifications]
      security:
        - oidcAuth: [ai_hub.identity, platform.notification.request]
      parameters:
        - name: notification_id
          in: path
          required: true
          description: Notification uuid returned by `createNotification`.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Local IN_APP test-channel result visible only to its calling application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /platform-api/v1/data/objects:
    get:
      operationId: listAggregatedObjects
      summary: List aggregated objects
      description: |
        Page current-state objects ingested from registered `DATA_INGEST` applications.
        Filter by source application, object type, or object id. Requires `platform.data.read`.
      tags: [data]
      security:
        - oidcAuth: [ai_hub.identity, platform.data.read]
      parameters:
        - name: source_application_id
          in: query
          required: false
          description: Restrict results to one ingesting application id.
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
        - name: object_type
          in: query
          required: false
          description: Registered object type slug.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: object_id
          in: query
          required: false
          description: Business object id within the type namespace.
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: limit
          in: query
          required: false
          description: Page size (default 100, max 500).
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          description: Zero-based offset for pagination.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Current-state objects from platform aggregated data.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AggregatedObjectList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform-api/v1/data/objects/{source_application_id}/{object_type}/{object_id}:
    get:
      operationId: getAggregatedObject
      summary: Get one aggregated object
      description: Fetch the latest version and payload for a single ingested object. Returns 404 if never ingested or tombstoned.
      tags: [data]
      security:
        - oidcAuth: [ai_hub.identity, platform.data.read]
      parameters:
        - name: source_application_id
          in: path
          required: true
          description: Ingesting application id.
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
        - name: object_type
          in: path
          required: true
          description: Registered object type slug.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: object_id
          in: path
          required: true
          description: Business object id.
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: One current-state aggregated object.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AggregatedObject"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /platform-api/v1/data/objects/{source_application_id}/{object_type}/{object_id}/history:
    get:
      operationId: listAggregatedObjectHistory
      summary: Object change history
      description: |
        Page raw ingest history (upsert/delete operations) for one object.
        Ordered by ingest receipt; use for audit and debugging ingest pipelines.
      tags: [data]
      security:
        - oidcAuth: [ai_hub.identity, platform.data.read]
      parameters:
        - name: source_application_id
          in: path
          required: true
          description: Ingesting application id.
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
        - name: object_type
          in: path
          required: true
          description: Registered object type slug.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: object_id
          in: path
          required: true
          description: Business object id.
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: limit
          in: query
          required: false
          description: Page size (default 100, max 500).
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          description: Zero-based offset for pagination.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Version history for one aggregated object from the raw change log.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AggregatedObjectHistoryList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  securitySchemes:
    oidcAuth:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.internal/application/o/ai-hub/.well-known/openid-configuration
      description: Short-lived authentik access token validated locally using OIDC Discovery and JWKS. Every protected operation also requires ai_hub.identity.
  parameters:
    ApplicationId:
      name: X-Application-ID
      in: header
      required: false
      description: Registered application id for audit and multi-tenant context. Lowercase slug matching `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$`.
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
    RequiredApplicationId:
      name: X-Application-ID
      in: header
      required: true
      description: Required registered application id. Must match an application the caller is authorized to act within.
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
    ApplicationPathId:
      name: application_id
      in: path
      required: true
      description: Registered application id path parameter.
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
  responses:
    Unauthorized:
      description: Missing, malformed, expired, or otherwise invalid bearer token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: Scope, actor type, application status, or authorization denied the request.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: The requested resource was not found in the caller's scope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: {type: string, const: ok, description: Always `ok` when the probe succeeds.}
        service: {type: string, description: Platform service name.}
        version: {type: string, description: Deployed platform API version string.}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user_id, subject, display_name, status, organization_id, organization_name, authorization_version]
      properties:
        user_id: {type: string, format: uuid, description: Stable platform user uuid.}
        subject: {type: string, description: OIDC subject (`sub`) claim.}
        display_name: {type: string, description: Human-readable user name.}
        email: {type: [string, "null"], format: email, description: Primary email if known.}
        status: {type: string, description: Platform account status (for example ACTIVE).}
        organization_id: {type: string, description: Organization slug or id.}
        organization_name: {type: string, description: Organization display name.}
        authorization_version: {type: integer, minimum: 1, description: Monotonic version; invalidate cached permissions when it increases.}
    DataScope:
      type: object
      additionalProperties: false
      required: [scope_type, value]
      properties:
        scope_type: {type: string, description: Data scope discriminator understood by the application.}
        value: {type: object, additionalProperties: true, description: Opaque scope payload (structure depends on scope_type).}
    PermissionSnapshot:
      type: object
      additionalProperties: false
      required: [application_id, user_id, permissions, data_scopes, authorization_version, expires_at]
      properties:
        application_id: {type: string, description: Application this snapshot applies to.}
        user_id: {type: string, format: uuid, description: Platform user uuid.}
        permissions:
          type: array
          uniqueItems: true
          description: Granted permission strings for this user within the application.
          items: {type: string}
        data_scopes:
          type: array
          description: Row-level or domain scopes limiting data access.
          items: {$ref: "#/components/schemas/DataScope"}
        authorization_version: {type: integer, minimum: 1, description: Snapshot version; compare with CurrentUser.authorization_version.}
        expires_at: {type: string, format: date-time, description: Do not use the snapshot after this instant.}
    AuthorizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [application_id, permission]
      properties:
        application_id: {type: string, description: Application context for the decision.}
        permission: {type: string, description: Registered permission key to evaluate.}
        risk: {type: string, enum: [low, high], default: high, description: Risk tier; high triggers stricter online checks.}
    AuthorizationDecision:
      type: object
      additionalProperties: false
      required: [allowed, permission, authorization_version, reason_code, expires_at]
      properties:
        allowed: {type: boolean, description: Whether the permission is granted for this request.}
        permission: {type: string, description: Evaluated permission key.}
        authorization_version: {type: integer, minimum: 1, description: Authorization version at decision time.}
        reason_code: {type: string, description: Stable machine-readable reason (for example ALLOWED, DENIED_SCOPE).}
        expires_at: {type: string, format: date-time, description: Decision validity window for allowed results.}
    ApplicationEnvironment:
      type: object
      additionalProperties: false
      required: [environment, portal_url, api_base_url, health_url, oidc_redirect_uris, version, status]
      properties:
        environment: {type: string, description: Environment slug.}
        portal_url: {type: string, format: uri, description: User-facing portal entry URL.}
        api_base_url: {type: string, format: uri, description: Application API base URL.}
        health_url: {type: string, format: uri, description: URL probed by platform health-check.}
        oidc_redirect_uris:
          type: array
          description: Allowed OAuth redirect URIs for this environment (exact match).
          items: {type: string, format: uri}
        version: {type: string, description: Deployed application version string reported at registration.}
        status: {type: string, description: Registration status for this environment.}
        last_health_status: {type: [string, "null"], description: Last persisted probe result (HEALTHY/UNHEALTHY) or null if never checked.}
        last_health_checked_at: {type: [string, "null"], format: date-time, description: Timestamp of last health probe, if any.}
    ApplicationRegistration:
      type: object
      additionalProperties: false
      required: [application_id, name, description, owner, status, capabilities, environments]
      properties:
        application_id: {type: string, description: Stable application slug.}
        name: {type: string, description: Display name.}
        description: {type: string, description: Short purpose summary.}
        owner: {type: string, description: Owning team or contact.}
        status: {type: string, description: Global registration status.}
        capabilities:
          type: array
          description: Enabled integration modes. `API_CLIENT` = platform API consumer; `DATA_INGEST` = exposes export endpoint for aggregation.
          items: {type: string, enum: [API_CLIENT, DATA_INGEST]}
        environments:
          type: array
          description: Per-environment URLs and health metadata.
          items: {$ref: "#/components/schemas/ApplicationEnvironment"}
    NotificationRequest:
      type: object
      additionalProperties: false
      required: [recipient_user_id, subject, body, idempotency_key]
      properties:
        recipient_user_id: {type: string, format: uuid, description: Platform user uuid to receive the notification.}
        subject: {type: string, minLength: 1, maxLength: 200, description: Notification title.}
        body: {type: string, minLength: 1, maxLength: 4000, description: Plain-text body for the IN_APP test channel.}
        idempotency_key: {type: string, minLength: 8, maxLength: 128, description: Unique per logical send; duplicate keys return the original result.}
        payload: {type: object, additionalProperties: true, default: {}, description: Optional structured metadata stored with the notification.}
    NotificationResult:
      type: object
      description: Current delivery results are produced only by the local IN_APP test channel; external providers are not enabled.
      additionalProperties: false
      required: [notification_id, application_id, recipient_user_id, subject, status, requested_at]
      properties:
        notification_id: {type: string, format: uuid, description: Notification id for status polling.}
        application_id: {type: string, description: Calling application id.}
        recipient_user_id: {type: string, format: uuid, description: Target user uuid.}
        subject: {type: string, description: Notification title.}
        status: {type: string, enum: [PENDING, DELIVERED, FAILED], description: Local channel status; not external delivery proof.}
        requested_at: {type: string, format: date-time, description: Creation timestamp.}
        delivered_at: {type: [string, "null"], format: date-time, description: Local delivery timestamp when status is DELIVERED.}
        delivery_reference: {type: [string, "null"], description: Optional internal reference id.}
        failure_reason: {type: [string, "null"], description: Failure detail when status is FAILED.}
    AggregatedObject:
      type: object
      additionalProperties: false
      required:
        - source_application_id
        - object_type
        - object_id
        - version
        - payload
        - payload_contract_version
        - updated_at
      properties:
        source_application_id: {type: string, description: Application that ingested the object.}
        object_type: {type: string, description: Registered object type.}
        object_id: {type: string, description: Business object id.}
        version: {type: integer, minimum: 1, description: Latest ingested version number.}
        payload: {type: [object, "null"], additionalProperties: true, description: Contract-shaped payload; null if tombstoned.}
        payload_contract_version: {type: [string, "null"], description: Declared payload schema version from the source app.}
        updated_at: {type: string, format: date-time, description: Last ingest timestamp for this object.}
    AggregatedObjectList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AggregatedObject"}
        total: {type: integer, minimum: 0, description: Total matching objects (may exceed page size).}
        limit: {type: integer, minimum: 1, maximum: 500, description: Page size used.}
        offset: {type: integer, minimum: 0, description: Offset used.}
    AggregatedObjectHistoryRecord:
      type: object
      additionalProperties: false
      required:
        - source_application_id
        - object_type
        - object_id
        - operation
        - version
        - payload
        - payload_contract_version
        - content_hash
        - received_at
        - batch_id
      properties:
        source_application_id: {type: string, description: Source application id.}
        object_type: {type: string, description: Object type slug.}
        object_id: {type: string, description: Business object id.}
        operation: {type: string, enum: [upsert, delete], description: Ingest operation type.}
        version: {type: integer, minimum: 1, description: Monotonic version at ingest time.}
        payload: {type: [object, "null"], additionalProperties: true, description: Payload for upsert; null for delete tombstones.}
        payload_contract_version: {type: [string, "null"], description: Payload contract version at ingest.}
        content_hash: {type: [string, "null"], description: Optional content fingerprint for deduplication audit.}
        received_at: {type: string, format: date-time, description: Platform receipt timestamp.}
        batch_id: {type: string, format: uuid, description: Ingest batch correlation id.}
    AggregatedObjectHistoryList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AggregatedObjectHistoryRecord"}
        total: {type: integer, minimum: 0, description: Total history records for the object.}
        limit: {type: integer, minimum: 1, maximum: 500, description: Page size used.}
        offset: {type: integer, minimum: 0, description: Offset used.}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, message, details, request_id]
      properties:
        error_code: {type: string, description: Stable error identifier for programmatic handling.}
        message: {type: string, description: Human-readable summary safe to show operators.}
        details: {type: object, additionalProperties: true, description: Structured validation or context fields.}
        request_id: {type: string, description: Correlation id; echo on support requests.}
