asyncapi: 3.0.0
info:
  title: AI Hub Domain Events
  version: 0.1.0
  description: Event envelope contract shared by registered applications.
defaultContentType: application/cloudevents+json
channels:
  domainEvents:
    address: ai-hub.events
    messages:
      domainEvent:
        $ref: "#/components/messages/DomainEvent"
operations:
  receiveDomainEvent:
    action: receive
    channel:
      $ref: "#/channels/domainEvents"
components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: Versioned domain event
      contentType: application/cloudevents+json
      payload:
        $ref: "./cloud-event.schema.json"
