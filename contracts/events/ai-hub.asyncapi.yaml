asyncapi: 3.0.0
info:
  title: AI Hub Reliable Domain Events
  version: 0.2.0
  description: >-
    M2 contract for at-least-once business events. Publishers use a local
    transactional Outbox and publisher confirms; consumers use manual
    acknowledgements and a transactional Inbox. Duplicate delivery is expected.
defaultContentType: application/cloudevents+json
servers:
  standardEvents:
    host: rabbitmq:5672
    protocol: amqp
    description: Environment-isolated RabbitMQ vhost; credentials are assigned per application role.
channels:
  exampleRecordEvents:
    address: ai-hub.events
    description: Durable topic exchange for registered, versioned business facts.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: ai-hub.events
          type: topic
          durable: true
          autoDelete: false
    messages:
      exampleRecordEvent:
        $ref: "#/components/messages/ExampleRecordEvent"
  platformProjectionQueue:
    address: ai-hub.platform.projection
    description: Durable platform projection queue with a bounded retry and dead-letter path.
    bindings:
      amqp:
        is: queue
        queue:
          name: ai-hub.platform.projection
          durable: true
          exclusive: false
          autoDelete: false
    messages:
      exampleRecordEvent:
        $ref: "#/components/messages/ExampleRecordEvent"
operations:
  publishExampleRecordEvent:
    action: send
    channel:
      $ref: "#/channels/exampleRecordEvents"
    messages:
      - $ref: "#/channels/exampleRecordEvents/messages/exampleRecordEvent"
  projectExampleRecordEvent:
    action: receive
    channel:
      $ref: "#/channels/platformProjectionQueue"
    messages:
      - $ref: "#/channels/platformProjectionQueue/messages/exampleRecordEvent"
components:
  messages:
    ExampleRecordEvent:
      name: ExampleRecordEvent
      title: Business-neutral versioned example record fact
      contentType: application/cloudevents+json
      correlationId:
        location: $message.payload#/trace_id
      payload:
        $ref: "./cloud-event.schema.json"
